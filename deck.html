<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EMMA · Lee a tu ritmo — Gancho, Sistema, Aval, Cierre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        paper: 'rgb(var(--paper) / <alpha-value>)', paper2: 'rgb(var(--paper-2) / <alpha-value>)',
        ink: 'rgb(var(--ink) / <alpha-value>)', clay: 'rgb(var(--clay) / <alpha-value>)',
        claydeep: 'rgb(var(--clay-deep) / <alpha-value>)', jade: 'rgb(var(--jade) / <alpha-value>)',
        ochre: 'rgb(var(--ochre) / <alpha-value>)',
      },
      fontFamily: { serif: ['Fraunces', '"Iowan Old Style"', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
    } },
  };
</script>
<style>
  :root {
    --paper: 250 247 242; --paper-2: 242 235 224; --ink: 36 31 26;
    --clay: 192 86 42; --clay-deep: 170 72 32; --jade: 31 122 107; --ochre: 198 154 69;
    --on-clay: 250 247 242; --grain-blend: multiply; --grain-op: .55;
    --halo-a: 198 154 69; --halo-b: 192 86 42; --glow: 0;
    --echo: 31 122 107;
  }
  .dark {
    --paper: 22 18 15; --paper-2: 32 26 21; --ink: 240 231 217;
    --clay: 222 112 64; --clay-deep: 222 112 64; --jade: 70 196 170; --ochre: 216 176 96;
    --on-clay: 22 18 15; --grain-blend: soft-light; --grain-op: .5;
    --halo-a: 70 196 170; --halo-b: 198 120 60; --glow: 1;
    --echo: 84 214 186;
  }
  html, body { background: rgb(var(--paper-2)); color: rgb(var(--ink)); }
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .8s ease, color .8s ease; }
  .serif { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-variation-settings: "SOFT" 100, "opsz" 144; }
  .serif-text { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-variation-settings: "SOFT" 60, "opsz" 24; }

  /* ---------- Materialidad (idéntica a la lámina adjunta) ---------- */
  .slide {
    position: relative; overflow: hidden; isolation: isolate;
    width: 1600px; height: 900px; border-radius: 28px; background: rgb(var(--paper));
    box-shadow: 0 0 0 1px rgb(var(--ink) / .08), 0 1px 0 0 rgb(255 255 255 / .5) inset, 0 12px 24px -8px rgb(36 31 26 / .10), 0 40px 80px -24px rgb(36 31 26 / .22);
    transition: background .8s ease; transform-origin: 0 0;
  }
  .dark .slide { box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 30px 80px -20px rgb(0 0 0 / .7), 0 0 180px -60px rgb(var(--jade) / .25); }
  .grain::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 50;
    mix-blend-mode: var(--grain-blend); opacity: var(--grain-op);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .14  0 0 0 0 .12  0 0 0 0 .10  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .halo { position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 18% 8%, rgb(var(--halo-a) / .22), transparent 70%), radial-gradient(50% 35% at 100% 100%, rgb(var(--halo-b) / .12), transparent 70%); }
  .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 20;
    background: radial-gradient(120% 90% at 64% 44%, transparent 45%, rgb(120 92 60 / .18) 100%); }
  .dark .vignette { background: radial-gradient(110% 85% at 64% 44%, transparent 35%, rgb(0 0 0 / .6) 100%); }
  .sheet {
    background: rgb(var(--paper)); background-image: linear-gradient(180deg, rgb(255 255 255 / .35), transparent 40%);
    box-shadow: 0 0 0 1px rgb(var(--ink) / .08), 0 1px 1px rgb(36 31 26 / .05), 0 6px 14px -6px rgb(36 31 26 / .14), 0 18px 32px -18px rgb(36 31 26 / .18);
  }
  .dark .sheet { background: rgb(var(--paper-2)); background-image: linear-gradient(180deg, rgb(255 255 255 / .04), transparent 40%); box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 20px 40px -20px rgb(0 0 0 / .7); }
  .glow-breathe { pointer-events: none; border-radius: 9999px; filter: blur(40px); transform: translate(-50%,-50%); animation: glowBreathe 9s ease-in-out infinite; }
  @keyframes glowBreathe { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: .85 } 50% { transform: translate(-50%,-50%) scale(1.08); opacity: 1 } }

  /* ---------- Eco ---------- */
  .echo { position: absolute; pointer-events: none; z-index: 0; transform: translate(-50%,-50%); }
  .echo-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgb(var(--jade) / .5); opacity: 0; animation: echo 8s cubic-bezier(.2,.6,.35,1) infinite; }
  .dark .echo-ring { box-shadow: 0 0 18px rgb(var(--jade) / .25), inset 0 0 18px rgb(var(--jade) / .12); }
  @keyframes echo { 0% { transform: scale(.14); opacity: 0 } 10% { opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
  .echo-ring.settle { animation-name: settle; animation-timing-function: cubic-bezier(.1,.5,.2,1); }
  @keyframes settle { 0% { transform: scale(.2); opacity: 0 } 15% { opacity: .55 } 100% { transform: scale(.62); opacity: 0 } }
  .echo-core { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%;
    background: rgb(var(--jade)); box-shadow: 0 0 0 6px rgb(var(--jade) / .12), 0 0 calc(30px * var(--glow)) rgb(var(--jade) / .8); animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1) } 50% { transform: scale(1.18) } }

  /* ---------- Entrada escalonada (repetible en bucle) ---------- */
  .slide:not(.play) .in, .slide:not(.play) .stamp { opacity: 0; }
  .play .in { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) var(--d, 0s) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(4px) } to { opacity: 1; transform: none; filter: none } }
  .leaving .in, .leaving .stamp { animation: leave .7s cubic-bezier(.4,0,.2,1) both !important; }
  @keyframes leave { from { opacity: 1; filter: none } to { opacity: 0; filter: blur(6px) } }
  .draw-x { transform-origin: left center; }
  .play .draw-x { animation: drawX 1.4s cubic-bezier(.6,0,.2,1) var(--d, 0s) both; }
  @keyframes drawX { from { transform: scaleX(0) } to { transform: scaleX(1) } }

  /* ---------- 1 · Gancho ---------- */
  .tab { animation: tabDrop 9s cubic-bezier(.3,0,.2,1) infinite; animation-delay: calc(var(--i) * .22s); }
  @keyframes tabDrop {
    0% { transform: translateY(-150px); opacity: 0 } 4% { opacity: 1 }
    12% { transform: translateY(0) } 14% { transform: translateY(-7px) } 16% { transform: translateY(0) }
    86% { transform: translateY(0); opacity: 1 } 94%, 100% { transform: translateY(0); opacity: 0 }
  }
  .bar { transform-box: fill-box; transform-origin: left center; }
  .bar-deploy { animation: deploy 9s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes deploy { 0%, 8% { transform: scaleX(0); opacity: 1 } 32% { transform: scaleX(1) } 86% { transform: scaleX(1); opacity: 1 } 94%, 100% { transform: scaleX(1); opacity: 0 } }
  .bar-learn { transform: scaleX(.05); animation: learn 9s ease-in-out infinite; }
  @keyframes learn { 0%, 32% { transform: scaleX(0); opacity: 1 } 40% { transform: scaleX(.07) } 48% { transform: scaleX(.03) } 58% { transform: scaleX(.06) } 68% { transform: scaleX(.035) } 78% { transform: scaleX(.055) } 86% { transform: scaleX(.05); opacity: 1 } 94%, 100% { transform: scaleX(.05); opacity: 0 } }
  .spark { opacity: .7; animation: spark 9s ease-in-out infinite; filter: drop-shadow(0 0 calc(8px * var(--glow) + 1px) rgb(var(--jade) / .8)); }
  @keyframes spark { 0%, 32% { opacity: 0 } 40% { opacity: 1 } 48% { opacity: .25 } 58% { opacity: .9 } 68% { opacity: .2 } 78% { opacity: .8 } 86% { opacity: .55 } 94%, 100% { opacity: 0 } }
  .count { animation: countPulse 9s ease-in-out infinite; }
  @keyframes countPulse { 0%, 26% { opacity: 0 } 34%, 86% { opacity: 1 } 94%, 100% { opacity: 0 } }

  /* ---------- 2 · Cabeza → cultura ---------- */
  .ext-ring { stroke-dasharray: 1; animation: extRing 15s cubic-bezier(.5,0,.25,1) infinite; }
  @keyframes extRing { 0%, 12% { stroke-dashoffset: 1; opacity: 1 } 34% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
  .spoke { stroke-dasharray: 1; }
  .spoke-a { animation: spokeA 15s cubic-bezier(.5,0,.25,1) infinite; }
  .spoke-b { animation: spokeB 15s cubic-bezier(.5,0,.25,1) infinite; }
  .spoke-c { animation: spokeC 15s cubic-bezier(.5,0,.25,1) infinite; }
  @keyframes spokeA { 0%, 30% { stroke-dashoffset: 1; opacity: 1 } 40% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { opacity: 0 } }
  @keyframes spokeB { 0%, 36% { stroke-dashoffset: 1; opacity: 1 } 46% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { opacity: 0 } }
  @keyframes spokeC { 0%, 42% { stroke-dashoffset: 1; opacity: 1 } 52% { stroke-dashoffset: 0 } 88% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { opacity: 0 } }
  .cnode { transform-box: fill-box; transform-origin: center; }
  .cnode-a { animation: nodeA 15s cubic-bezier(.2,.8,.3,1.1) infinite; }
  .cnode-b { animation: nodeB 15s cubic-bezier(.2,.8,.3,1.1) infinite; }
  .cnode-c { animation: nodeC 15s cubic-bezier(.2,.8,.3,1.1) infinite; }
  @keyframes nodeA { 0%, 38% { opacity: 0; transform: translateY(8px) } 46%, 88% { opacity: 1; transform: none } 95%, 100% { opacity: 0 } }
  @keyframes nodeB { 0%, 44% { opacity: 0; transform: translateY(8px) } 52%, 88% { opacity: 1; transform: none } 95%, 100% { opacity: 0 } }
  @keyframes nodeC { 0%, 50% { opacity: 0; transform: translateY(8px) } 58%, 88% { opacity: 1; transform: none } 95%, 100% { opacity: 0 } }
  .cnode circle:first-child { filter: drop-shadow(0 0 calc(10px * var(--glow)) rgb(var(--clay) / .7)); }
  .culture-label { animation: cultureLabel 15s ease-in-out infinite; }
  @keyframes cultureLabel { 0%, 58% { opacity: 0 } 66%, 88% { opacity: 1 } 95%, 100% { opacity: 0 } }
  .head-label { animation: headLabel 15s ease-in-out infinite; }
  @keyframes headLabel { 0%, 20% { opacity: 1 } 34%, 90% { opacity: .35 } 100% { opacity: 1 } }
  .head-core { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; filter: drop-shadow(0 0 calc(10px * var(--glow)) rgb(var(--jade) / .9)); }
  .ext-ring { filter: drop-shadow(0 0 calc(12px * var(--glow)) rgb(var(--jade) / .55)); }
  .calm .cnode, .calm .culture-label { opacity: 1; }
  .calm .ext-ring, .calm .spoke { stroke-dashoffset: 0; }

  /* ---------- 3 · Sistema ---------- */
  .node-dot { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: rgb(var(--paper)); border: 1.5px solid rgb(var(--ink) / .3);
    transition: background .6s ease, border-color .6s ease, box-shadow .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
  .node.is-lit .node-dot { background: rgb(var(--clay)); border-color: rgb(var(--clay)); transform: scale(1.15);
    box-shadow: 0 0 0 7px rgb(var(--clay) / .14), 0 0 calc(26px * var(--glow) + 4px) rgb(var(--clay) / .55); }
  .node.is-now .node-dot { box-shadow: 0 0 0 12px rgb(var(--clay) / .16), 0 0 calc(34px * var(--glow) + 8px) rgb(var(--clay) / .7); }
  .node-label { opacity: .32; filter: blur(.4px); transition: opacity .7s ease, filter .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .node.is-lit .node-label { opacity: 1; filter: none; }
  .progress { transition: stroke-dashoffset 1.6s cubic-bezier(.45,0,.25,1); }
  .core { transition: box-shadow 1s ease; }
  .core.is-lit { box-shadow: 0 0 0 1px rgb(var(--jade) / .5), 0 0 0 14px rgb(var(--jade) / .07), 0 0 calc(80px * var(--glow) + 10px) rgb(var(--jade) / .35); }
  .seg { stroke: rgb(var(--ink) / .14); transition: stroke .6s ease; }
  .core.is-lit .seg.ok { stroke: rgb(var(--jade)); }
  .core.is-lit .seg.ok:nth-of-type(2) { transition-delay: .25s } .core.is-lit .seg.ok:nth-of-type(3) { transition-delay: .5s }
  .core .verdict { opacity: 0; transform: translateY(4px); transition: opacity .6s ease .7s, transform .6s ease .7s; }
  .core.is-lit .verdict { opacity: 1; transform: none; }
  .core .gest { color: rgb(var(--ink) / .4); transition: color .5s ease; }
  .core.is-lit .gest.ok { color: rgb(var(--ink) / .85); }
  .stamp { transform: rotate(-7deg); }
  .play .stamp { animation: stamp .8s cubic-bezier(.2,.9,.3,1.2) var(--d, 0s) both; }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-14deg) scale(1.7) } 60% { opacity: 1; transform: rotate(-6deg) scale(.95) } 100% { opacity: 1; transform: rotate(-7deg) scale(1) } }
  .training { animation: training 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes training { 0%, 30% { opacity: 1; transform: translateY(0) } 55%, 85% { opacity: 0; transform: translateY(-6px) } 100% { opacity: 1; transform: translateY(0) } }
  .flowdash { stroke-dasharray: 3 6; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -9 } }

  /* ---------- 4 · Aval ---------- */
  .qmark { animation: qbreath 10s ease-in-out infinite; }
  @keyframes qbreath { 0%, 100% { opacity: .9 } 50% { opacity: 1; text-shadow: 0 0 calc(40px * var(--glow)) rgb(var(--clay) / .35) } }
  .word { display: inline-block; }
  .play .word { animation: rise .9s cubic-bezier(.2,.7,.2,1) var(--d) both; }
  .slide:not(.play) .word { opacity: 0; }
  .leaving .word { animation: leave .7s ease both !important; }

  /* ---------- 5 · Cierre ---------- */
  .plant { animation: plantFade 13s ease-in-out infinite; }
  @keyframes plantFade { 0%, 86% { opacity: 1 } 94%, 100% { opacity: 0 } }
  .stem { stroke-dasharray: 1; stroke-dashoffset: 0; animation: stem 13s cubic-bezier(.5,0,.3,1) infinite; }
  @keyframes stem { 0%, 6% { stroke-dashoffset: 1 } 38%, 100% { stroke-dashoffset: 0 } }
  .leaf { transform: scale(1); }
  .leaf-a { animation: leafA 13s cubic-bezier(.2,.8,.3,1.1) infinite; }
  .leaf-b { animation: leafB 13s cubic-bezier(.2,.8,.3,1.1) infinite; }
  .leaf-c { animation: leafC 13s cubic-bezier(.2,.8,.3,1.1) infinite; }
  .leaf-d { animation: leafD 13s cubic-bezier(.2,.8,.3,1.1) infinite; }
  @keyframes leafA { 0%, 16% { transform: scale(0) } 30%, 100% { transform: scale(1) } }
  @keyframes leafB { 0%, 24% { transform: scale(0) } 38%, 100% { transform: scale(1) } }
  @keyframes leafC { 0%, 32% { transform: scale(0) } 46%, 100% { transform: scale(1) } }
  @keyframes leafD { 0%, 38% { transform: scale(0) } 52%, 100% { transform: scale(1) } }
  .bud { transform-box: fill-box; transform-origin: center bottom; animation: bud 13s cubic-bezier(.2,.8,.3,1.2) infinite; }
  @keyframes bud { 0%, 44% { transform: scale(0); opacity: 0 } 58%, 100% { transform: scale(1); opacity: 1 } }
  .bud-glow { animation: budGlow 13s ease-in-out infinite; }
  @keyframes budGlow { 0%, 50% { opacity: 0 } 62% { opacity: 1 } 74% { opacity: .55 } 86% { opacity: .9 } 94%, 100% { opacity: 0 } }
  .seed { transform-box: fill-box; transform-origin: center; animation: seed 13s ease-in-out infinite; }
  @keyframes seed { 0% { transform: scale(.6); opacity: .4 } 6% { transform: scale(1.12); opacity: 1 } 12%, 100% { transform: scale(1); opacity: 1 } }
  .sway { transform-box: view-box; transform-origin: 200px 470px; animation: sway 7s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.2deg) } 50% { transform: rotate(1.2deg) } }
  .apple-line { box-shadow: inset 3px 0 0 rgb(var(--clay)); }

  /* ---------- Chrome ---------- */
  .press { transition: transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s ease, background-color .5s ease; }
  .press:hover { transform: translateY(-1px); } .press:active { transform: translateY(1px) scale(.99); }
  :focus-visible { outline: 2px solid rgb(var(--jade)); outline-offset: 3px; border-radius: 12px; }
  .ui-hidden .chrome { opacity: 0; pointer-events: none; }
  .chrome { transition: opacity .5s ease; }
  .screen-in { animation: screenIn 1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(10px) scale(.985); filter: blur(8px) } to { opacity: 1; transform: none; filter: none } }

  /* Movimiento reducido: estado final, sin bucles (activable con «Movimiento: Auto») */
  .calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }
  .calm .slide .in, .calm .slide .word, .calm .slide .stamp { opacity: 1 !important; }
  .calm .echo-ring { opacity: .25; transform: scale(.6); }
  .calm .bud-glow { opacity: .8; }
</style>
</head>
<body>
<main id="app" class="min-h-screen px-4 pb-6 pt-5">
  <header class="chrome mx-auto mb-5 flex max-w-[1600px] flex-wrap items-center justify-between gap-4">
    <div class="flex items-baseline gap-4">
      <div class="flex items-center gap-2.5">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="2" fill="rgb(var(--clay))" />
          <circle cx="9" cy="9" r="5" fill="none" stroke="rgb(var(--ink) / .45)" stroke-width=".8" />
          <circle cx="9" cy="9" r="8.2" fill="none" stroke="rgb(var(--ink) / .2)" stroke-width=".8" />
        </svg>
        <span class="text-[11px] font-semibold uppercase tracking-[.22em] text-ink/80">EMMA</span>
        <span class="h-3 w-px bg-ink/20"></span><span class="text-[11px] tracking-wide text-ink/55">Lee a tu ritmo</span>
      </div>
      <span class="serif text-[15px] italic text-ink/55">portada · gancho · pregunta · sistema · aval · cierre</span>
    </div>
    <div class="flex flex-wrap gap-2" id="controls"></div>
  </header>

  <section id="stage" class="flex flex-col items-center">
    <div id="slides" class="flex w-full justify-center">
<!-- =================== 00 · PORTADA =================== -->
<figure class="frame min-w-0" data-name="Portada" data-folio="00">
<section class="slide grain" aria-label="Portada: EMMA, Extended Mind Measured Acoustically">
  <div class="halo"></div>
  <div class="echo" data-size="900" data-rings="4" data-duration="12" data-settle style="left:50%;top:48%;opacity:.5"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="relative z-30 flex h-full flex-col px-20 pb-11 pt-14">
    <header class="in flex items-start justify-between" style="--d:.1s">
      <div class="flex items-baseline gap-3">
        <span class="serif text-[22px] tracking-[.04em] text-ink">EMMA</span>
        <span class="text-ink/30">·</span>
        <span class="text-[11px] uppercase tracking-[.28em] text-ink/55">Lee a tu ritmo</span>
      </div>
      <span class="text-[11px] uppercase tracking-[.28em] text-ink/45">Proyecto Guelaguetza</span>

    <div class="flex flex-1 items-stretch">
      <div class="flex flex-1 flex-col justify-center pb-4">
        <span class="in flex items-center gap-3 text-[12px] font-semibold uppercase tracking-[.32em] text-ink/60" style="--d:.3s">
          <span class="h-2 w-2 rounded-full bg-jade" aria-hidden="true"></span>Cierre
        </span>
        <h1 class="serif mt-8 text-[150px] leading-[.88] tracking-[-.05em] text-ink" style="font-weight:300">
          <span class="in block" style="--d:.6s">No se fabrica.</span>
          <span class="in block" style="--d:1.3s"><em class="text-jade">Se cultiva.</em></span>
        </h1>
        <p class="in apple-line serif-text mt-14 max-w-[760px] text-pretty pl-7 text-[31px] font-light italic leading-[1.3] text-ink/85" style="--d:2.4s">
          «La mejor forma de aprender la manzana no es que te la cuenten: es <span class="not-italic text-clay" style="font-weight:420">morderla</span>.»
        </p>
      </div>

      <div class="relative w-[520px] shrink-0" role="img" aria-label="Una semilla germina y crece hasta brotar; su eco se calma.">
        <div class="echo" data-size="520" data-rings="4" data-duration="13" data-settle style="left:50%;top:86%"></div>
        <svg viewBox="0 0 400 540" class="absolute bottom-6 left-1/2 h-[700px] w-[520px] -translate-x-1/2 overflow-visible" aria-hidden="true">
          <defs>
            <radialGradient id="budGlow"><stop offset="0" stop-color="rgb(var(--jade))" stop-opacity=".55" /><stop offset="1" stop-color="rgb(var(--jade))" stop-opacity="0" /></radialGradient>
            <linearGradient id="leafFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgb(var(--jade))" stop-opacity=".95" /><stop offset="1" stop-color="rgb(var(--jade))" stop-opacity=".6" /></linearGradient>
          </defs>
          <path d="M40,470 Q200,452 360,470" fill="none" stroke="rgb(var(--ochre) / .8)" stroke-width="1.3" />
          <path d="M70,486 Q200,474 330,486" fill="none" stroke="rgb(var(--ochre) / .4)" stroke-dasharray="2 5" />
          <ellipse class="seed" cx="200" cy="472" rx="11" ry="7" fill="rgb(var(--ochre))" />
          <g class="plant"><g class="sway">
            <path class="stem" pathLength="1" d="M200,468 C197,420 207,382 200,332 C193,284 205,246 200,196 C197,166 201,138 200,112" fill="none" stroke="rgb(var(--jade))" stroke-width="3.2" stroke-linecap="round" />
            <g transform="translate(201,392) rotate(-24)"><g class="leaf leaf-a"><path d="M0,0 C22,-28 70,-32 104,-8 C70,10 24,14 0,0Z" fill="url(#leafFill)" /><path d="M4,-1 C34,-10 66,-12 96,-8" fill="none" stroke="rgb(var(--paper) / .45)" stroke-width="1" /></g></g>
            <g transform="translate(199,318) scale(-1,1) rotate(-26)"><g class="leaf leaf-b"><path d="M0,0 C20,-26 64,-30 96,-8 C64,9 22,13 0,0Z" fill="url(#leafFill)" /><path d="M4,-1 C30,-10 60,-12 88,-8" fill="none" stroke="rgb(var(--paper) / .45)" stroke-width="1" /></g></g>
            <g transform="translate(201,246) rotate(-30)"><g class="leaf leaf-c"><path d="M0,0 C16,-22 54,-26 82,-7 C54,8 18,11 0,0Z" fill="url(#leafFill)" /><path d="M4,-1 C26,-9 52,-10 74,-7" fill="none" stroke="rgb(var(--paper) / .45)" stroke-width="1" /></g></g>
            <g transform="translate(199,178) scale(-1,1) rotate(-34)"><g class="leaf leaf-d"><path d="M0,0 C14,-18 44,-21 66,-6 C44,6 14,9 0,0Z" fill="url(#leafFill)" /></g></g>
            <circle class="bud-glow" cx="200" cy="100" r="64" fill="url(#budGlow)" />
            <g class="bud">
              <path d="M200,114 C186,104 186,84 200,70 C214,84 214,104 200,114Z" fill="rgb(var(--clay))" />
              <path d="M200,114 C192,104 192,90 200,80" fill="none" stroke="rgb(var(--paper) / .5)" stroke-width="1" />
            </g>
          </g></g>
        </svg>
      </div>
    </div>

    <footer class="in flex items-center justify-between gap-6 border-t border-ink/10 pt-5 text-[12px] text-ink/50" style="--d:3s">
      <span class="flex items-center gap-3"><span class="font-semibold uppercase tracking-[.22em] text-ink/70">EMMA</span><span>Lee a tu ritmo</span></span>
      <span class="serif text-[14px] italic text-ink/60">EMMA · por una abuela de Oaxaca.</span>
      <span class="serif italic tabular-nums text-ink/60">05 / 05</span>
    </footer>
  </div>
</section>
</figure>

    </div>

    <div class="chrome mt-4 flex w-full max-w-[1600px] flex-wrap items-center justify-between gap-4" id="tourbar">
      <button type="button" data-go="-1" class="press rounded-full px-4 py-2 text-[13px] text-ink/60 ring-1 ring-ink/15 hover:text-ink">← Anterior</button>
      <nav aria-label="Diapositivas" class="flex items-center gap-1.5" id="dots"></nav>
      <span class="serif min-w-[200px] text-center text-[13px] italic text-ink/60" id="caption"></span>
      <button type="button" data-go="1" class="press rounded-full px-4 py-2 text-[13px] text-ink/60 ring-1 ring-ink/15 hover:text-ink">Siguiente →</button>
    </div>
    <p class="chrome mt-3 text-center text-[11px] tracking-wide text-ink/40">← → navegar · R repetir entrada · L bucle · T tema · H ocultar interfaz para grabar</p>
  </section>
</main>

<script>
(() => {
  const html = document.documentElement;
  const frames = [...document.querySelectorAll('.frame')];
  const slides = frames.map((f) => f.querySelector('.slide'));
  const reducedMQ = matchMedia('(prefers-reduced-motion: reduce)');
  const state = {
    theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
    view: 'tour', idx: 0, loop: true, motion: 'auto', ui: true,
  };
  const LOOP_MS = [14000, 15000, 15000, 16000, 14000, 13000];

  /* ---- Eco ---- */
  document.querySelectorAll('.echo').forEach((el) => {
    const size = +el.dataset.size, rings = +el.dataset.rings, dur = +el.dataset.duration, settle = 'settle' in el.dataset;
    el.style.width = el.style.height = size + 'px';
    el.setAttribute('aria-hidden', 'true');
    let s = '<svg viewBox="0 0 100 100" class="absolute inset-0 h-full w-full">';
    [10, 18, 26, 34, 42, 49].forEach((r, i) => { s += `<circle cx="50" cy="50" r="${r}" fill="none" stroke="rgb(var(--ink) / .08)" stroke-width=".14"${i % 2 ? ' stroke-dasharray=".35 .9"' : ''}/>`; });
    s += '<line x1="50" y1="0" x2="50" y2="100" stroke="rgb(var(--ink) / .05)" stroke-width=".12"/><line x1="0" y1="50" x2="100" y2="50" stroke="rgb(var(--ink) / .05)" stroke-width=".12"/></svg>';
    for (let i = 0; i < rings; i++) s += `<span class="echo-ring${settle ? ' settle' : ''}" style="animation-duration:${dur}s;animation-delay:${-(dur / rings) * i}s"></span>`;
    s += '<span class="echo-core"></span>';
    el.innerHTML = s;
  });

  /* ---- Tabletas ---- */
  const tg = document.getElementById('tablets');
  tg.innerHTML = Array.from({ length: 6 }, (_, i) => {
    const x = 28 + i * 104;
    return `<g class="tab" style="--i:${i}"><g transform="translate(${x},58)">
      <rect width="66" height="90" rx="10" fill="rgb(var(--paper))" stroke="rgb(var(--ink) / .55)" stroke-width="1.2"/>
      <rect x="6" y="8" width="54" height="68" rx="3" fill="rgb(var(--ink) / .07)"/>
      <line x1="13" y1="22" x2="45" y2="22" stroke="rgb(var(--ink) / .18)" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="31" x2="37" y2="31" stroke="rgb(var(--ink) / .14)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="33" cy="83" r="1.8" fill="rgb(var(--ink) / .4)"/></g></g>`;
  }).join('');

  /* ---- Cita palabra a palabra ---- */
  document.querySelectorAll('.split').forEach((p) => {
    let t = +p.dataset.start, step = +p.dataset.step;
    const wrap = (text) => text.split(/(\s+)/).map((w) => {
      if (!w.trim()) return w;
      const s = `<span class="word" style="--d:${t.toFixed(2)}s">${w}</span>`; t += step; return s;
    }).join('');
    p.innerHTML = [...p.childNodes].map((n) => n.nodeType === 3 ? wrap(n.textContent)
      : (n.innerHTML = wrap(n.textContent), n.outerHTML)).join('');
  });

  /* ---- Sistema: órbita de 5 pasos ---- */
  const STEPS = [
    ['Describe', 'qué hay y para quién', 'below'],
    ['Verifica', 'huella de lectura', 'left'],
    ['Localiza', 'la barrera', 'right'],
    ['Interviene', 'andamio, nunca la respuesta', 'right'],
    ['Mide', 'κ · frente a sí mismo', 'left'],
  ];
  const orbitPath = document.getElementById('orbitPath');
  const nodesEl = document.getElementById('nodes');
  const spokes = document.getElementById('spokes');
  const total = orbitPath.getTotalLength();
  const nodeEls = STEPS.map(([name, sub, side], i) => {
    const p = orbitPath.getPointAtLength((total * i) / 5);
    const el = document.createElement('div');
    el.className = 'node absolute';
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    const pos = side === 'below' ? 'left:-90px;top:22px;width:180px;text-align:center'
      : side === 'left' ? 'right:26px;top:-24px;width:230px;text-align:right'
      : 'left:26px;top:-24px;width:240px;text-align:left';
    el.innerHTML = `<div class="node-dot absolute"></div>
      <div class="node-label absolute" style="${pos}">
        <p class="text-[10px] uppercase tracking-[.24em] text-clay">Paso ${i + 1}</p>
        <p class="serif text-[28px] leading-[1.05] tracking-[-.02em] text-ink" style="font-weight:380">${name}</p>
        <p class="serif-text mt-0.5 text-[14px] italic leading-snug text-ink/60">${sub}</p>
      </div>`;
    nodesEl.appendChild(el);
    spokes.insertAdjacentHTML('beforeend', `<line x1="${p.x}" y1="${p.y}" x2="500" y2="220" stroke="rgb(var(--ink) / .07)" stroke-dasharray="2 5"/>`);
    return el;
  });
  const core = document.getElementById('core');
  let step = -1;
  function renderStep(s) {
    nodeEls.forEach((el, i) => { el.classList.toggle('is-lit', s >= i); el.classList.toggle('is-now', s === i); });
    core.classList.toggle('is-lit', s >= 5);
    const frac = s < 0 ? 0 : s <= 4 ? s / 5 : 1;
    if (s < 0) { orbitPath.style.transition = 'none'; orbitPath.getBoundingClientRect(); }
    else orbitPath.style.transition = '';
    orbitPath.style.strokeDashoffset = 1 - frac;
  }
  setInterval(() => {
    if (html.classList.contains('calm')) { renderStep(6); return; }
    step = step >= 7 ? -1 : step + 1;
    renderStep(step);
  }, 1700);

  /* ---- Entrada repetible ---- */
  const timers = new Map();
  function play(slide) {
    slide.classList.remove('play', 'leaving'); void slide.offsetWidth; slide.classList.add('play');
  }
  function replay(slide) {
    if (html.classList.contains('calm')) return play(slide);
    slide.classList.add('leaving');
    setTimeout(() => play(slide), 700);
  }
  function schedule() {
    timers.forEach(clearInterval); timers.clear();
    const active = state.view === 'tour' ? [state.idx] : slides.map((_, i) => i);
    active.forEach((i) => {
      play(slides[i]);
      if (state.loop) timers.set(i, setInterval(() => replay(slides[i]), LOOP_MS[i]));
    });
  }

  /* ---- Escalado 16:9 ---- */
  function layout() {
    frames.forEach((f, i) => {
      const slide = slides[i];
      let s;
      if (state.view === 'tour') {
        const W = innerWidth - 32, H = innerHeight - (state.ui ? 170 : 32);
        s = Math.min(W / 1600, H / 900);
      } else s = f.clientWidth / 1600 || .4;
      slide.style.transform = `scale(${s})`;
      f.style.height = 900 * s + 'px';
      if (state.view === 'tour') f.style.width = 1600 * s + 'px'; else f.style.width = '';
    });
  }

  /* ---- Controles ---- */
  const controls = document.getElementById('controls');
  function seg(label, key, opts) {
    return `<div role="radiogroup" aria-label="${label}" class="flex rounded-full bg-paper p-1 ring-1 ring-ink/10">${opts.map(([v, l]) =>
      `<button type="button" role="radio" data-k="${key}" data-v="${v}" aria-checked="${String(state[key]) === v}"
        class="rounded-full px-3.5 py-1.5 text-[12px] transition-all duration-500 ${String(state[key]) === v ? 'bg-ink text-paper' : 'text-ink/60 hover:text-ink'}">${l}</button>`).join('')}</div>`;
  }
  function renderControls() {
    controls.innerHTML = seg('Vista', 'view', [['tour', 'Recorrido'], ['grid', 'Galería']])
      + seg('Tema', 'theme', [['light', 'Claro'], ['dark', 'Oscuro']])
      + seg('Bucle', 'loop', [['true', 'Bucle'], ['false', 'Una vez']])
      + seg('Movimiento', 'motion', [['auto', 'Auto'], ['always', 'Siempre animado']])
      + `<button type="button" data-act="replay" class="press rounded-full px-3.5 py-1.5 text-[12px] text-ink/70 ring-1 ring-ink/15 hover:text-ink">Repetir ↺</button>`;
  }
  controls.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'replay') return schedule();
    const { k, v } = b.dataset;
    set(k, v === 'true' ? true : v === 'false' ? false : v);
  });

  const dots = document.getElementById('dots');
  const caption = document.getElementById('caption');
  function renderDots() {
    dots.innerHTML = frames.map((f, i) => `<button type="button" data-i="${i}" aria-label="${f.dataset.folio} ${f.dataset.name}" title="${f.dataset.name}"
      ${i === state.idx ? 'aria-current="step"' : ''} class="group flex h-6 items-center px-0.5">
      <span class="block h-1.5 rounded-full transition-all duration-500 ${i === state.idx ? 'w-6 bg-clay' : 'w-1.5 bg-ink/25 group-hover:bg-ink/50'}"></span></button>`).join('');
    caption.textContent = `${frames[state.idx].dataset.folio} · ${frames[state.idx].dataset.name}`;
  }
  dots.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) set('idx', +b.dataset.i); });
  document.getElementById('tourbar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go);
  });
  const go = (d) => set('idx', (state.idx + d + frames.length) % frames.length);

  const container = document.getElementById('slides');
  function apply() {
    html.classList.toggle('dark', state.theme === 'dark');
    html.classList.toggle('calm', state.motion === 'auto' && reducedMQ.matches);
    document.getElementById('app').classList.toggle('ui-hidden', !state.ui);
    const tour = state.view === 'tour';
    container.className = tour ? 'flex w-full justify-center' : 'mx-auto grid w-full max-w-[1900px] grid-cols-1 gap-x-10 gap-y-10 xl:grid-cols-2';
    frames.forEach((f, i) => {
      f.style.display = !tour || i === state.idx ? '' : 'none';
    });
    document.getElementById('tourbar').style.display = tour ? '' : 'none';
    renderControls(); renderDots(); layout();
  }
  function set(k, v) {
    const prev = state[k]; state[k] = v; apply();
    if (k === 'idx' || k === 'view' || k === 'loop' || k === 'motion') {
      if (k === 'idx' && prev !== v) { frames[v].classList.remove('screen-in'); void frames[v].offsetWidth; frames[v].classList.add('screen-in'); }
      schedule();
    }
  }

  addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (k === 't') set('theme', state.theme === 'dark' ? 'light' : 'dark');
    else if (k === 'l') set('loop', !state.loop);
    else if (k === 'r') schedule();
    else if (k === 'h') { state.ui = !state.ui; apply(); }
    else if (/^[1-4]$/.test(k)) set('idx', +k - 1);
  });
  addEventListener('resize', layout);
  reducedMQ.addEventListener('change', () => { apply(); schedule(); });
  new ResizeObserver(layout).observe(container);

  apply();
  document.fonts.ready.then(() => { layout(); schedule(); });
})();
</script>
</body>
</html>
